plugins { id 'com.android.application' }
def signingFile = System.getenv('NASIE_KEYSTORE')
android {
 namespace 'ir.nasie.offline'
 compileSdk 35
 defaultConfig {
  applicationId 'ir.nasie.offline'
  minSdk 26
  targetSdk 35
  versionCode Integer.parseInt(System.getenv('NASIE_VERSION_CODE') ?: '1')
  versionName '1.0.' + (System.getenv('NASIE_VERSION_CODE') ?: '1')
 }
 signingConfigs {
  if (signingFile) {
   release {
    storeFile file(signingFile)
    storePassword System.getenv('NASIE_STORE_PASSWORD')
    keyAlias System.getenv('NASIE_KEY_ALIAS')
    keyPassword System.getenv('NASIE_KEY_PASSWORD')
   }
  }
 }
 buildTypes {
  debug { applicationIdSuffix '.test'; versionNameSuffix '-test' }
  release { if (signingFile) signingConfig signingConfigs.release; minifyEnabled false }
 }
 testOptions { unitTests.includeAndroidResources = true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.14.1'
 implementation 'androidx.webkit:webkit:1.12.1'
 implementation 'androidx.media3:media3-common:1.4.1'
 implementation 'androidx.media3:media3-exoplayer:1.4.1'
 implementation 'androidx.media3:media3-exoplayer-rtsp:1.4.1'
 implementation 'androidx.work:work-runtime:2.10.1'
 implementation 'com.google.android.gms:play-services-auth:21.4.0'
 implementation 'com.alphacephei:vosk-android:0.3.75@aar'
 implementation 'net.java.dev.jna:jna:5.18.1@aar'
}
