<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f6b5c"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="stylesheet" href="css/style.css"><title>دفتر نسیه</title></head>
<body><header><div class="hrow"><h1>دفتر نسیه</h1><button id="trb" onclick="trashView()">🗑</button></div><div id="total"></div></header>
<main id="view"></main><div id="sheet" hidden></div><div id="toast" hidden></div>
<div class="cmd"><input id="cmd" placeholder="مثلا: پنجاه هزار تومان بزن به حساب علی" enterkeyhint="go"><button id="mic">🎤</button><button id="go">ثبت</button></div>
<nav aria-label="ناوبری اصلی"><button data-t="dash" aria-label="داشبورد">داشبورد</button><button data-t="list" aria-label="مشتریان">مشتریان</button><button data-t="log" aria-label="تغییرات">تغییرات</button><button data-t="ai" aria-label="دستیار">دستیار</button><button data-t="set" aria-label="تنظیمات">تنظیمات</button></nav>
<script src="js/store.js"></script><script src="js/parser.js"></script><script src="js/ledger.js"></script><script src="js/telegram.js"></script><script src="js/app.js"></script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update();r.addEventListener('updatefound',()=>{const n=r.installing;n&&n.addEventListener('statechange',()=>{if(n.state==='installed'&&navigator.serviceWorker.controller&&window.toast)toast('نسخه‌ی جدید آماده شد؛ اپ را کامل ببند و دوباره باز کن')})})}).catch(()=>{}))</script></body></html>
