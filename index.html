<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="nasie-release" content="19"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07151f"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="stylesheet" href="css/style.css"><title>دفتر نسیه</title></head>
<body class="intro" data-tab="dash"><div class="phone"><div class="screen" id="screen">
<section class="hero"><div class="hero-bg"></div><div class="topbar">
 <button class="glass circle" data-liquid onclick="backup()" aria-label="بکاپ کامل JSON">📦</button>
 <button class="glass circle" data-liquid onclick="trashView()" aria-label="سطل زباله">🗑</button></div></section>
<section class="ident"><h1>دفتر نسیه</h1><p class="sub">دفتر بدهی و نسیه‌ی مشتریان</p><div id="total" class="glass pill" data-liquid></div></section>
<div id="storage-status" role="status" style="padding:0 14px"></div><div id="update-status" style="padding:0 14px"></div><main id="view"></main></div>
<div id="sheet" hidden></div><div id="toast" hidden></div>
<div class="cmd"><input id="cmd" role="combobox" aria-autocomplete="list" aria-controls="cmd-suggestions" aria-expanded="false" autocomplete="off" placeholder="مثلا: پنجاه هزار تومان بزن به حساب علی" enterkeyhint="go"><button id="mic">🎤</button><button id="go">ثبت</button><div id="cmd-suggestions" hidden></div></div>
<nav aria-label="منوی اصلی"><button data-t="dash" aria-label="داشبورد"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l9-7 9 7v10H3z M9 20v-7h6v7"/></svg><span>داشبورد</span></button><button data-t="list" aria-label="مشتریان"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M17 4a4 4 0 0 1 0 8 M22 21v-2a4 4 0 0 0-3-4"/></svg><span>مشتریان</span></button><button data-t="log" aria-label="تغییرات"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10 M10 20V4 M16 20v-7 M22 20H2"/></svg><span>تغییرات</span></button><button data-t="ai" aria-label="دستیار"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/></svg><span>دستیار</span></button><button data-t="set" aria-label="تنظیمات"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16 M4 17h16 M8 4v6 M16 14v6"/></svg><span>تنظیمات</span></button></nav></div>
<script src="js/store.js"></script><script src="js/safety.js"></script><script src="js/jdate.js"></script><script src="js/parser.js"></script><script src="js/ledger.js"></script><script src="js/telegram.js"></script><script src="js/liquid.js"></script><script src="js/app.js"></script>
<script>
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
 let applying=false;
 const show=()=>{if(!reg.waiting)return;const box=document.querySelector('#update-status');box.textContent='نسخه جدید آماده است. ';
 const button=document.createElement('button');button.textContent='به‌روزرسانی برنامه';button.onclick=()=>{
  if(!confirm('فرم باز بسته می‌شود. قبل از به‌روزرسانی از تنظیمات خروجی JSON بگیر. ادامه؟'))return;
  if(!reg.waiting)return;applying=true;if(typeof rec!=='undefined'&&rec)rec.abort();Store.releaseWriter?.();reg.waiting.postMessage({type:'ACTIVATE_UPDATE'});
 };box.appendChild(button)};
 show();reg.update().catch(()=>{});reg.addEventListener('updatefound',()=>{const worker=reg.installing;worker&&worker.addEventListener('statechange',()=>{if(worker.state==='installed')show()})});
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(applying)location.reload()});
}).catch(()=>{}));
</script></body></html>
